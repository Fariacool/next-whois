name: Build and Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yaml
    with:
      skip-build: true

  build:
    name: Build linux/${{ matrix.arch }}
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set image name
        id: image
        run: echo "name=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha,format=long

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Restore Next.js build cache
        id: next-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tmp/next-cache
          key: docker-next-v1-${{ matrix.arch }}-${{ hashFiles('pnpm-lock.yaml', 'Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            docker-next-v1-${{ matrix.arch }}-${{ hashFiles('pnpm-lock.yaml', 'Dockerfile') }}-

      # GHA layer caching does not persist RUN cache mounts across runners.
      - name: Inject and extract Next.js cache mount
        uses: reproducible-containers/buildkit-cache-dance@7a38cfab60c63ee1022b7c1a14a031c82f4114c7 # v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: '{".tmp/next-cache": "/app/.next/cache"}'
          scratch-dir: .tmp/cache-dance
          skip-extraction: ${{ steps.next-cache.outputs.cache-hit }}

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,scope=docker-${{ matrix.arch }},mode=max

      - name: Test the built container
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          API_KEY: ci-smoke-runtime-key
          COMPOSE_PROJECT_NAME: next-whois-smoke
          COMPOSE_NETWORK_NAME: next-whois-smoke
          HOST_BIND_ADDRESS: 127.0.0.1
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          compose_cmd() {
            docker compose --env-file .env.example --file docker-compose.yml "$@"
          }
          trap 'compose_cmd down >/dev/null 2>&1 || true' EXIT
          compose_cmd up --detach --pull always
          container_id="$(compose_cmd ps --quiet app)"
          test "$(docker network inspect "${COMPOSE_NETWORK_NAME}_dualstack" --format '{{.EnableIPv6}}')" = true
          docker exec --interactive --env "EXPECTED_ARCH=${TARGET_ARCH}" \
            "${container_id}" node --input-type=module < .github/scripts/docker-smoke.mjs

      - name: Export image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if ! [[ "${IMAGE_DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid image digest: ${IMAGE_DIGEST}" >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${IMAGE_DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform image
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set image name
        id: image
        run: echo "name=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Download image digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: image-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha,format=long

      # Only publish shared tags after both native images pass their smoke test.
      - name: Create and push multi-platform manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          METADATA_JSON: ${{ steps.meta.outputs.json }}
        run: |
          shopt -s nullglob
          digests=(*)
          if [ "${#digests[@]}" -ne 2 ]; then
            echo "Expected two platform image digests, found ${#digests[@]}." >&2
            exit 1
          fi

          images=()
          for digest in "${digests[@]}"; do
            if ! [[ "${digest}" =~ ^[a-f0-9]{64}$ ]]; then
              echo "Invalid digest artifact: ${digest}" >&2
              exit 1
            fi
            images+=("${IMAGE_NAME}@sha256:${digest}")
          done

          tags=()
          while IFS= read -r tag; do
            tags+=(--tag "${tag}")
          done < <(jq -r '.tags[]' <<< "${METADATA_JSON}")
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "No image tags were generated." >&2
            exit 1
          fi
          docker buildx imagetools create "${tags[@]}" "${images[@]}"

      - name: Verify published platforms
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          image="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker buildx imagetools inspect --raw "${image}" \
            | jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'
          docker buildx imagetools inspect "${image}"
