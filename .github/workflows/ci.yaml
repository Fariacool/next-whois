name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      skip-build:
        description: Skip the production build when the Docker matrix builds the app
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build
        if: ${{ !inputs.skip-build }}
        run: pnpm build
