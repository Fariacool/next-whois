services:
  app:
    image: ${IMAGE_NAME:-ghcr.io/fariacool/next-whois:latest}
    ports:
      - '${HOST_BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-3000}:3000'
    networks:
      - dualstack
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      TZ: ${TZ:-UTC}
      API_KEY: ${API_KEY:-}
      WHOIS_BATCH_LIMIT: ${WHOIS_BATCH_LIMIT:-10}
      WHOIS_MAX_CONCURRENT: ${WHOIS_MAX_CONCURRENT:-20}
      WHOIS_PER_SERVER_CONCURRENT: ${WHOIS_PER_SERVER_CONCURRENT:-5}
      MOZ_ACCESS_ID: ${MOZ_ACCESS_ID:-}
      MOZ_SECRET_KEY: ${MOZ_SECRET_KEY:-}
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_CACHE_TTL: ${REDIS_CACHE_TTL:-3600}
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/en').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '${LOG_MAX_SIZE:-10m}'
        max-file: '${LOG_MAX_FILE:-3}'
    restart: '${RESTART_POLICY:-unless-stopped}'
    stop_grace_period: 15s

networks:
  dualstack:
    name: ${COMPOSE_NETWORK_NAME:-next-whois}_dualstack
    driver: bridge
    enable_ipv6: true
